<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القارئ — لُدران</title>
<meta name="description" content="قارئ الكتب داخل الموقع في مكتبة لُدران.">
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main>
<section class="page-head" style="padding-bottom:.5rem;">
  <p class="breadcrumb"><a href="library.html">المكتبة</a> <span>‹</span> <span id="crumbBook">الكتاب</span></p>
</section>

<section class="reader" id="reader" aria-label="قارئ الكتاب">
  <div class="reader-bar">
    <button class="reader-back" id="readerBack" aria-label="العودة إلى المكتبة">→ العودة إلى المكتبة</button>
    <h1 class="reader-title" id="readerBookTitle">—</h1>
    <span class="reader-author" id="readerBookAuthor">—</span>
    <button class="reader-share" id="readerShare" data-share="reader.html?book={id}" title="نسخ رابط الكتاب" aria-label="نسخ الرابط">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="18" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 11l8-4M8 13l8 4" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>نسخ الرابط</span>
    </button>
  </div>

  <div class="reader-stage" id="readerStage">
    <article class="reader-paper" id="readerPaper">
      <div class="reader-loading">يُحمّل الكتاب…</div>
    </article>
    <div class="pdf-viewer hidden" id="pdfViewer" aria-label="عارض PDF">
      <div class="pdf-loading" id="pdfLoading">يُحمّل ملف PDF…</div>
      <canvas class="pdf-canvas" id="pdfCanvas" aria-label="صفحة PDF"></canvas>
      <div class="pdf-loading hidden" id="pdfError">تعذّر تحميل ملف PDF. <a href="#" id="pdfRetry">حاول مرةً أخرى</a> أو <a href="library.html">عُد إلى المكتبة</a>.</div>
    </div>
  </div>

  <div class="reader-controls">
    <button class="reader-btn" id="readerPrev" aria-label="السابق">→ السابق</button>
    <span class="reader-pagewords" id="readerPageInfo">—</span>
    <button class="reader-btn" id="readerNext" aria-label="التالي">التالي ←</button>
    <div class="reader-progress" id="readerProgress" aria-hidden="true">
      <div class="reader-progress-fill" id="readerProgressFill"></div>
    </div>
  </div>

  <div class="reader-toolbar" id="readerToolbar">
    <div class="reader-toolbar-group">
      <button class="reader-tool" id="fontMinus" title="خطّ أصغر">A−</button>
      <span class="reader-tool-label" id="fontSizeLabel">100%</span>
      <button class="reader-tool" id="fontPlus" title="خطّ أكبر">A+</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <div class="reader-toolbar-group">
      <button class="reader-tool" id="lhMinus" title="تباعد أصغر">⇕−</button>
      <span class="reader-tool-label" id="lhLabel">2.1</span>
      <button class="reader-tool" id="lhPlus" title="تباعد أكبر">⇕+</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <div class="reader-toolbar-group">
      <button class="reader-tool reader-theme-light" data-set-theme="light" title="نهاري">☀</button>
      <button class="reader-tool reader-theme-sepia" data-set-theme="sepia" title="ورقي">◐</button>
      <button class="reader-tool reader-theme-night" data-set-theme="night" title="ليلي">☾</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <button class="reader-tool reader-notes-toggle" id="readerNotesToggle" title="ملاحظات">✎ <span class="reader-notes-badge hidden" id="readerNotesBadge">0</span></button>
    <div class="reader-toolbar-divider pdf-only hidden" id="pdfZoomDivider"></div>
    <div class="reader-toolbar-group pdf-only hidden" id="pdfZoomGroup">
      <button class="reader-tool" id="pdfZoomMinus" title="تصغير">−</button>
      <span class="reader-tool-label" id="pdfZoomLabel">120%</span>
      <button class="reader-tool" id="pdfZoomPlus" title="تكبير">+</button>
    </div>
  </div>

  <aside class="reader-notes" id="readerNotesPanel" aria-hidden="true">
    <div class="reader-notes-head">
      <h3>ملاحظاتي</h3>
      <button class="reader-notes-close" id="readerNotesClose" aria-label="إغلاق">&times;</button>
    </div>
    <div class="reader-notes-new">
      <textarea id="readerNoteNew" rows="3" placeholder="أضف ملاحظةً على هذا الكتاب…"></textarea>
      <button class="reader-btn reader-btn-block" id="readerNoteSave">حفظ الملاحظة</button>
    </div>
    <div class="reader-notes-list" id="readerNotesList"></div>
  </aside>

</section>

<section class="section section-alt" id="relatedSection" aria-label="من نفس الرف" hidden>
  <div class="section-head">
    <h2 class="section-title">من نفس الرف</h2>
    <p class="section-lede">عناوينٌ قريبةٌ من هذا الكتاب — في التصنيف والوسوم وعمر الإصدار.</p>
  </div>
  <div class="card-grid" id="relatedGrid"></div>
</section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<!-- PDF.js (Mozilla) bundled locally so PDF reading works offline too. -->
<script src="js/pdf.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
