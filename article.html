<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المقالة — لُدران</title>
<meta name="description" content="قراءة مقالةٍ من تحرير لُدران أو كتابٍ مدعوٍّ.">
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main>
<section class="page-head" style="padding-bottom:.5rem;">
  <p class="breadcrumb"><a href="library.html#articles">المكتبة</a> <span>‹</span> <span id="crumbArticle">المقالة</span></p>
</section>

<section class="article-page" id="articlePage" aria-label="مقالة">
  <div class="reader-bar">
    <button class="reader-back" id="articleBack" aria-label="العودة إلى المكتبة">→ العودة إلى المكتبة</button>
    <h1 class="reader-title" id="articleTitle">—</h1>
    <span class="reader-author" id="articleAuthor">—</span>
    <button class="reader-share" id="articleShare" data-share="article.html?id={id}" title="نسخ رابط المقالة" aria-label="نسخ الرابط">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="18" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 11l8-4M8 13l8 4" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>نسخ الرابط</span>
    </button>
  </div>

  <div class="reader-stage">
    <article class="reader-paper" id="articlePaper">
      <div class="reader-loading">يُحمّل المقالة…</div>
    </article>
  </div>

  <div class="reader-toolbar">
    <div class="reader-toolbar-group">
      <button class="reader-tool" id="fontMinus" title="خطّ أصغر">A−</button>
      <span class="reader-tool-label" id="fontSizeLabel">100%</span>
      <button class="reader-tool" id="fontPlus" title="خطّ أكبر">A+</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <div class="reader-toolbar-group">
      <button class="reader-tool" id="lhMinus" title="تباعد أصغر">⇕−</button>
      <span class="reader-tool-label" id="lhLabel">2.1</span>
      <button class="reader-tool" id="lhPlus" title="تباعد أكبر">⇕+</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <div class="reader-toolbar-group">
      <button class="reader-tool reader-theme-light" data-set-theme="light" title="نهاري">☀</button>
      <button class="reader-tool reader-theme-sepia" data-set-theme="sepia" title="ورقي">◐</button>
      <button class="reader-tool reader-theme-night" data-set-theme="night" title="ليلي">☾</button>
    </div>
    <div class="reader-toolbar-divider"></div>
    <button class="reader-tool reader-notes-toggle" id="articleNotesToggle" title="ملاحظات">✎ <span class="reader-notes-badge hidden" id="readerNotesBadge">0</span></button>
  </div>

  <aside class="reader-notes" id="readerNotesPanel" aria-hidden="true">
    <div class="reader-notes-head">
      <h3>ملاحظاتي</h3>
      <button class="reader-notes-close" id="readerNotesClose" aria-label="إغلاق">&times;</button>
    </div>
    <div class="reader-notes-new">
      <textarea id="readerNoteNew" rows="3" placeholder="أضف ملاحظةً على هذه المقالة…"></textarea>
      <button class="reader-btn reader-btn-block" id="readerNoteSave">حفظ الملاحظة</button>
    </div>
    <div class="reader-notes-list" id="readerNotesList"></div>
  </aside>
</section>

<section class="section section-alt" id="relatedSection" aria-label="مرتبط بهذا الموضوع" hidden>
  <div class="section-head">
    <h2 class="section-title">مرتبط بهذا الموضوع</h2>
    <p class="section-lede">مقالاتٌ وكتبٌ قريبةٌ من هذه المقالة — في التصنيف والوسوم والزمن.</p>
  </div>
  <div class="card-grid" id="relatedGrid"></div>
</section>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/article.js"></script>
</body>
</html>
