# Lodran — Nginx server config
# Lightweight static-file server for the Lodran cultural library.

# Run as a non-privileged user inside the container for safety.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Calm, server-side compat logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip text-based responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Web app manifest — serve with explicit MIME so browsers treat it as
        # a manifest (not octet-stream, which triggers a download).
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=3600";
        }

        # Service worker must NEVER be cached long, so updates apply quickly.
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            default_type text/javascript;
        }

        # Long cache for static assets, short for content (JSON can change when editors curate)
        location ~* \.(?:css|svg|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # JS: cache an hour, except sw.js (handled above) — kept separate so
        # we don't accidentally cache the SW long.
        location ~* \.js$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # PDF book files — allow Range requests for partial loads and enable
        # CORS so PDF.js (when loaded cross-origin from a CDN worker) can fetch
        # these without "tainted" failures.
        location ~* \.pdf$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Accept-Ranges bytes always;
        }

        # Photographic assets (jpg) — larger, rarely change once curated.
        location ~* \.(?:jpg|jpeg|png|webp|gif)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # JSON data: short cache so curated edits show up quickly
        location /data/ {
            expires 5m;
            add_header Cache-Control "public, max-age=300";
            default_type application/json;
        }

        # Clean URLs: /library -> library.html (helps if/when they reuse links)
        location ~ ^/(index|library|shelf|gallery|search|timeline|article|reader|about|404)$ {
            try_files $uri.html $uri /$uri.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Light custom error pages
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
